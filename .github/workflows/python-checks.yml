name: Python checks

on:
  push:
    branches: [main, feature/python-discord-bot]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Compile
        working-directory: backend
        run: python -m compileall -q src/tzone tests
      - name: Unit tests
        working-directory: backend
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
