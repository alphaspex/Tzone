<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10131b">
  <title>Model Lab — GLM Testing Workspace</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" aria-label="Model Lab home">
        <span class="brand-mark">M</span>
        <span><strong>Model Lab</strong><small>GLM testing workspace</small></span>
      </a>
      <div class="nav-caption">WORKSPACE</div>
      <nav id="navigation" class="navigation">
        <button class="nav-item active" data-page="overview"><span class="nav-icon">◫</span>Overview</button>
        <button class="nav-item" data-page="builder"><span class="nav-icon">✳</span>Test Builder</button>
        <button class="nav-item" data-page="runs"><span class="nav-icon">▷</span>Test Runs</button>
        <button class="nav-item" data-page="agent"><span class="nav-icon">◉</span>Harness Agent</button>
        <button class="nav-item" data-page="conversations"><span class="nav-icon">▤</span>Conversations</button>
        <button class="nav-item" data-page="tools"><span class="nav-icon">⌘</span>Tools</button>
        <div class="nav-caption nav-caption-spaced">OBSERVABILITY</div>
        <button class="nav-item" data-page="metrics"><span class="nav-icon">▥</span>Metrics</button>
        <button class="nav-item" data-page="traces"><span class="nav-icon">⌁</span>Traces &amp; Logs</button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span>Settings</button>
        <div class="connection-card">
          <span class="status-dot" id="sidebar-status"></span>
          <span><strong id="connection-label">Not connected</strong><small id="connection-sub">Set API URL in Settings</small></span>
        </div>
        <div class="sidebar-footer">MODEL LAB <span>v0.2</span></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation">☰</button>
        <div class="breadcrumbs"><span>Workspace</span><b>/</b><strong id="page-breadcrumb">Overview</strong></div>
        <div class="topbar-right">
          <span class="model-pill"><span class="status-dot"></span><span id="top-model">GLM-4.7-Flash</span></span>
          <button class="icon-button" id="refresh-button" title="Refresh data" aria-label="Refresh data">↻</button>
          <button class="avatar" data-page="settings" title="Settings">ML</button>
        </div>
      </header>
      <section class="page-wrap" id="page-content" aria-live="polite">
        <div class="loading-state"><span class="spinner"></span>Loading workspace…</div>
      </section>
    </main>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script src="app.js"></script>
</body>
</html>
